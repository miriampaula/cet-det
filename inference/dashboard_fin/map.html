<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetacean PAM Dataset Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #07090f;
    --surface: #0e1117;
    --surface2: #161b26;
    --border: #1e2535;
    --accent: #4af0c4;
    --accent2: #f0824a;
    --accent3: #a78bfa;
    --text: #e2e8f0;
    --muted: #64748b;
    --glow: rgba(74, 240, 196, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    z-index: 1000;
  }

  .header-left { display: flex; align-items: center; gap: 14px; }

  .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .subtitle {
    font-size: 11px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .stats-bar {
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .stat {
    text-align: right;
  }

  .stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .stat-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 2px;
  }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  #map {
    flex: 1;
    background: #07090f;
  }

  .sidebar {
    width: 320px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .dataset-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px;
  }

  .dataset-list::-webkit-scrollbar { width: 4px; }
  .dataset-list::-webkit-scrollbar-track { background: transparent; }
  .dataset-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .dataset-card {
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 4px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s ease;
    position: relative;
  }

  .dataset-card:hover {
    background: var(--surface2);
    border-color: var(--border);
  }

  .dataset-card.active {
    background: var(--surface2);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent) inset, 0 0 12px var(--glow);
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .card-name {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
  }

  .card-count {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(74,240,196,0.1);
    color: var(--accent);
  }

  .card-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .tag {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 3px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.04em;
  }

  .tag-env { background: rgba(167,139,250,0.15); color: var(--accent3); }
  .tag-type { background: rgba(240,130,74,0.15); color: var(--accent2); }
  .tag-region { background: rgba(100,116,139,0.15); color: var(--muted); }

  .card-sites {
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
    line-height: 1.4;
  }

  /* Popup styles */
  .leaflet-popup-content-wrapper {
    background: var(--surface2) !important;
    border: 1px solid var(--border) !important;
    border-radius: 10px !important;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important;
    color: var(--text) !important;
    font-family: 'DM Sans', sans-serif !important;
  }

  .leaflet-popup-tip {
    background: var(--surface2) !important;
  }

  .popup-title {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .popup-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin-bottom: 3px;
    color: var(--text);
  }

  .popup-label { color: var(--muted); }

  .popup-count {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    color: var(--accent);
    font-size: 14px;
    margin-top: 6px;
  }

  /* Legend */
  .legend {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .legend-title {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .legend-items {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--text);
  }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Leaflet dark tiles override */
  .leaflet-tile { filter: brightness(0.85) saturate(0.7) hue-rotate(180deg) invert(0.9) contrast(0.9); }
</style>
</head>

          <span style="color:#e2e8f0;font-weight:500;">${ds.name}</span>
        </div>
        <div class="popup-row" style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;">
          <span style="color:#64748b;">Provider</span>
          <span style="color:#e2e8f0;">${site.provider}</span>
        </div>
        <div class="popup-row" style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;">
          <span style="color:#64748b;">Sampling Rate</span>
          <span style="color:#e2e8f0;font-family:'Space Mono',monospace;">${srStr}</span>
        </div>
        <div class="popup-row" style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;">
          <span style="color:#64748b;">Depth</span>
          <span style="color:#e2e8f0;font-family:'Space Mono',monospace;">${depthStr}</span>
        </div>
        <div style="font-family:'Space Mono',monospace;font-weight:700;color:${color};font-size:15px;margin-top:8px;border-top:1px solid #1e2535;padding-top:8px;">
          ${ds.count.toLocaleString()} <span style="font-size:10px;color:#64748b;font-weight:400;">annotations</span>
        </div>
      </div>
    `);

    const marker = L.marker([site.lat, site.lon], { icon }).bindPopup(popup);
    group.addLayer(marker);
    allMarkers.push({ marker, ds, site });
  });

  group.addTo(map);
});

// Sidebar
const listEl = document.getElementById('dataset-list');
let activeId = null;

DATASETS.forEach(ds => {
  const card = document.createElement('div');
  card.className = 'dataset-card';
  card.dataset.id = ds.id;

  const color = ENV_COLORS[ds.env];
  const sitesText = ds.sites.length > 0
    ? ds.sites.map(s => s.name).join(' · ')
    : 'No fixed location';

  card.innerHTML = `
    <div class="card-top">
      <span class="card-name" style="color:${color}">${ds.name}</span>
      <span class="card-count">${ds.count.toLocaleString()}</span>
    </div>
    <div class="card-meta">
      <span class="tag tag-env">${ds.env}</span>
      <span class="tag tag-type">${ds.type}</span>
      <span class="tag tag-region">${ds.region}</span>
    </div>
    <div class="card-sites">${sitesText}</div>
  `;

  card.addEventListener('click', () => {
    if (activeId === ds.id) {
      // Deselect
      card.classList.remove('active');
      activeId = null;
      // Show all
      Object.values(markerGroups).forEach(g => { if (!map.hasLayer(g)) g.addTo(map); });
    } else {
      document.querySelectorAll('.dataset-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      activeId = ds.id;
      // Show only this dataset
      Object.entries(markerGroups).forEach(([id, g]) => {
        if (id === ds.id) { if (!map.hasLayer(g)) g.addTo(map); }
        else { if (map.hasLayer(g)) map.removeLayer(g); }
      });
      // Fly to first site
      if (ds.sites.length > 0) {
        const bounds = L.latLngBounds(ds.sites.map(s => [s.lat, s.lon]));
        map.flyToBounds(bounds.pad(0.5), { duration: 0.8, maxZoom: 8 });
      }
    }
  });

  listEl.appendChild(card);
});
}; // end window.onload
</script>
</body>
</html>
